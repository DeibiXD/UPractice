name: Backend CI (.NET)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-backend:
    name: Compilar Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore UPractice.slnx

      - name: Verificar compilación
        run: dotnet build UPractice.slnx --configuration Release --no-restore

      # Pruebas de integración contra PostgreSQL real (Testcontainers usa el Docker del runner),
      # incluidas las de aislamiento entre empresas (AislamientoTests).
      - name: Ejecutar pruebas
        run: dotnet test UPractice.slnx --configuration Release --no-build
