# SPA de React: cualquier ruta que no sea un archivo devuelve index.html (igual que vercel.json en producción).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de /assets llevan hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea, para que un nuevo build se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
